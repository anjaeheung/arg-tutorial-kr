  <!-- 特定のシステムメッセージの非表示 ＆ カウンター出現タイマー ＆ ボタン処理 -->
  <script>
  // 【新規追加】「答え」ボタンをクリックした時に実行する処理
  function revealAnswer() {
    const ansBtn = document.getElementById('ansBtn');
    const ansText = document.getElementById('answer-text');
    if (ansBtn && ansText) {
      ansBtn.style.display = 'none'; // ボタンを非表示にします
      ansText.style.display = 'block'; // キーワードテキストを表示します
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    // 11.5秒後（11500ミリ秒後）にページカウンターに「show-counter」クラスを付与
    setTimeout(() => {
      const counter = document.getElementById('page-counter');
      if (counter) {
        counter.classList.add('show-counter');
      }
    }, 11500);

    const observer = new MutationObserver(() => {
      // 検索モーダルのエリアを取得
      const modal = document.querySelector('.search-modal-content, .search-modal__content, [class*="search-modal"]');
      if (modal) {
        // モーダル内の要素を取得
        const elements = modal.querySelectorAll('p, span, div');
        elements.forEach((el) => {
          // 子要素を1つも持たない（末端の要素である）場合のみ判定します
          if (el.children.length === 0) {
            // 不完全なメッセージの要素だけを非表示にします
            if (el.textContent.includes('키워드가 아직 완전하지 않습니다')) {
              el.style.display = 'none';
            }
            if (el.textContent.includes('키워드의 일부는 맞는 것 같습니다')) {
              el.style.display = 'none';
            }
          }
        });
      }
    });

    // モーダルの動的な変化を監視
    observer.observe(document.body, {
      childList: true,
      subtree: true
    });
  });
  </script>
