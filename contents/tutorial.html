    <div class="top-nav__title">ARG初心者チュートリアル！</div>
    <div class="top-nav__search">

    <main class="content">
      <article class="article">
        <header class="article-header">
           <h1 class="article-title">チュートリアルが<span class="nobreak">はじまるよ</span></h1>
        </header>
        <div class="article-body">
          <p>
            そうです、それが第一歩です！<br>
            怪しい言葉や気になる言葉など<span class="nobreak">隠されたキーワードを見つけ</span><br>
            検索して新しいページに進む。<span class="nobreak">それが基本です。</span><br>
            次はこのゲームを制作した目的についてお話ししたいと思います。<br>
            何を検索したらいいのか、<span class="nobreak">わかりますか？</span><br>
            目的について、<span class="nobreak">お話ししたいです。</span><br>
          </p>
          <p style="text-align: right; color: #bdc8d5; font-size: 0.85rem;">ケ</p>

  <script type="module" src="../assets/js/core/index.js"></script>
<!-- 特定のシステムメッセージのみを安全に非表示にするスクリプト -->
<script>
document.addEventListener('DOMContentLoaded', () => {
  const observer = new MutationObserver(() => {
    // 検索モーダルのエリアを取得
    const modal = document.querySelector('.search-modal-content, .search-modal__content, [class*="search-modal"]');
    if (modal) {
      // モーダル内の要素を取得
      const elements = modal.querySelectorAll('p, span, div');
      elements.forEach((el) => {
        // 【修正点】子要素を1つも持たない（末端の要素である）場合のみ判定します
        if (el.children.length === 0) {
          // 不完全なメッセージの要素だけを非表示にします
          if (el.textContent.includes('キーワードはまだ不完全です')) {
            el.style.display = 'none';
          }
          if (el.textContent.includes('キーワードの一部は正しいようです')) {
            el.style.display = 'none';
          }
        }
      });
    }
  });

  // モーダルの動的な変化を監視
  observer.observe(document.body, {
    childList: true,
    subtree: true
  });
});
</script>
  
</body>
