 <!-- オープニング演出中の非表示と、終了後のふんわりアニメーションの定義 -->
 <style>
   /* 
     1. オープニング演出中（bodyにopening-activeクラスがある間）は、
     本来のコンテンツを強制的に完全に隠し、干渉を防ぎます。
   */
   body.opening-active .site-container,
   body.opening-active .arudan-logo,
   body.opening-active .arudan-text,
   body.opening-active .arudan-footer {
     opacity: 0 !important;
     visibility: hidden !important;
     pointer-events: none !important;
   }

   /* 
     2. タイトルが「ふんわり浮かび上がる（フェード＋スライドアップ）」アニメーションの定義
   */
   @keyframes fadeInUpLogo {
     from {
       opacity: 0;
       transform: translateY(15px); /* 15px 下の位置から開始 */
     }
     to {
       opacity: 1;
       transform: translateY(0);    /* 本来の位置へ */
     }
   }

   /* 
     3. フッターが「ゆっくり浮かび上がる」アニメーションの定義
   */
   @keyframes fadeInFooter {
     from {
       opacity: 0;
     }
     to {
       opacity: 1;
     }
   }

   /* 
     オープニング（opening-active）が終了した瞬間に、
     タイトルとフッターにアニメーションを自動でゼロから発火させます。
   */
   body:not(.opening-active) .arudan-logo {
     animation: fadeInUpLogo 2.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
   }

   body:not(.opening-active) .arudan-footer {
     animation: fadeInFooter 2.5s ease-out forwards;
   }

   /* 
     【新規追加】4. タイピング演出の折り返し調整
     スマホなどの狭い画面で「続けましょう。」が不自然に1〜2文字だけ改行されるのを防ぎます。
   */
   .typing-segment.nobreak {
     white-space: nowrap;
     display: inline-block; /* 確実に塊として機能させる設定 */
   }
 </style>

<script type="module" src="../assets/js/core/index.js"></script>
 <script>
 document.addEventListener('DOMContentLoaded', () => {
   // 1. 検索モーダルの監視
   const observer = new MutationObserver(() => {
     const modal = document.querySelector('.search-modal-content, .search-modal__content, [class*="search-modal"]'); 
     if (modal) {
       const elements = modal.querySelectorAll('p, span, div');
       elements.forEach((el) => {
         if (el.children.length === 0) {
           if (el.textContent.includes('키워드가 아직 완전하지 않습니다')) { 
             el.style.display = 'none'; 
           }
           if (el.textContent.includes('키워드의 일부는 맞는 것 같습니다')) {
             el.style.display = 'none';
           }
         }
       }); 
     }
   }); 

   observer.observe(document.body, {
     childList: true,
     subtree: true
   }); 

   // 2. 本文テキストのアニメーション動的生成・制御スクリプト
   function initTextAnimation() {
     const targetContainer = document.querySelector('.arudan-text');
     if (!targetContainer) return;
     
     if (targetContainer.dataset.animated === 'true') return;
     targetContainer.dataset.animated = 'true';

     const originalContent = targetContainer.innerHTML;
     const rawLines = originalContent.split(/<br\s*\/?>/i).map(line => line.trim());
     const validLines = rawLines.filter(line => line !== '');
     if (validLines.length < 2) return;
     
     const lastText = validLines.pop();
     
     // 1行ずつの要素を再構築する前に中身を一度空っぽにします
     targetContainer.innerHTML = '';
     
     // 再構築後に、本文エリアをフェードイン（opacity 1）させます
     targetContainer.style.opacity = '1';
     
     const fadeLines = [];
     validLines.forEach((text) => {
       const span = document.createElement('span');
       span.className = 'fade-line';
       span.style.opacity = '0';
       span.style.display = 'block';
       span.style.transition = 'opacity 0.8s ease';
       span.style.marginBottom = '0.5em';
       span.textContent = text;
       targetContainer.appendChild(span);
       fadeLines.push(span);
     });
     
     targetContainer.appendChild(document.createElement('br'));
     
     // タイピングコンテナ自体を作成
     const typingSpan = document.createElement('span');
     typingSpan.id = 'typing-line';
     typingSpan.style.display = 'block';
     typingSpan.style.minHeight = '1.5em';
     targetContainer.appendChild(typingSpan);
     
     const lineInterval = 1000;      
     const waitBeforeTyping = 1000;  
     const waitMiddle = 1500;        
     const typingSpeed = 100;        
     
     const part1Text = '자, ';
     const remainingText = lastText.startsWith(part1Text) ? lastText.substring(part1Text.length) : lastText;

     // 【改善点】「続けましょう。」の直前で折り返せるように、内部テキストを更に分割します
     const splitIndex = remainingText.indexOf('계속합시다.');
     let part2Text = remainingText;
     let part3Text = '';
     if (splitIndex !== -1) {
       part2Text = remainingText.substring(0, splitIndex); // 「チュートリアルを」
       part3Text = remainingText.substring(splitIndex);     // 「続けましょう。」
     }

     // タイピングを流し込むための個別スパンを作成
     const tSpan1 = document.createElement('span');
     const tSpan2 = document.createElement('span');
     const tSpan3 = document.createElement('span');
     tSpan3.className = 'typing-segment nobreak'; // 「続けましょう。」に改行禁止クラスを付与
     
     typingSpan.appendChild(tSpan1);
     typingSpan.appendChild(tSpan2);
     typingSpan.appendChild(tSpan3);

     function showLine(index) {
       if (index < fadeLines.length) {
         fadeLines[index].style.opacity = '1';
         setTimeout(() => {
           showLine(index + 1);
         }, lineInterval);
       } else {
         setTimeout(startTypingPart1, waitBeforeTyping);
       }
     }

     function startTypingPart1() {
       let charIndex = 0;
       function type() {
         if (charIndex < part1Text.length) {
           tSpan1.textContent += part1Text.charAt(charIndex);
           charIndex++;
           setTimeout(type, typingSpeed);
         } else {
           setTimeout(startTypingPart2, waitMiddle);
         }
       }
       type();
     }

     function startTypingPart2() {
       let charIndex = 0;
       function type() {
         if (charIndex < part2Text.length) {
           tSpan2.textContent += part2Text.charAt(charIndex);
           charIndex++;
           setTimeout(type, typingSpeed);
         } else {
           startTypingPart3();
         }
       }
       type();
     }

     function startTypingPart3() {
       let charIndex = 0;
       function type() {
         if (charIndex < part3Text.length) {
           tSpan3.textContent += part3Text.charAt(charIndex);
           charIndex++;
           setTimeout(type, typingSpeed);
         }
       }
       type();
     }

     // 要素がDOMに追加されてから150ミリ秒遅らせて1行目（showLine(0)）を開始します
     setTimeout(() => {
       showLine(0);
     }, 150);
   }

   // 3. オープニング演出の実行とタイミング制御
   const overlay = document.getElementById('opening-overlay');
   const logo = document.getElementById('opening-logo');

   function revealMainContent() {
     // 本文テキストの組み立てとフェードインアニメーションをここでトリガーします
     initTextAnimation();

     // 動的書き換え等があった場合の再ロード監視
     const animObserver = new MutationObserver(() => {
       initTextAnimation();
     });
     animObserver.observe(document.body, {
       childList: true,
       subtree: true
     });
   }

   if (overlay && logo) {
     // ① 0.5秒後に画像（ロゴ）をフェードイン
     setTimeout(() => {
       logo.style.opacity = '1';
     }, 500);

     // ② 4.0秒後にフェードアウトを開始
     setTimeout(() => {
       logo.style.opacity = '0';
       overlay.style.opacity = '0';

       // ③ フェードアウトの完了（さらに1.5秒後、計5.5秒時点）に要素を非表示にし、本編コンテンツを表示
       setTimeout(() => {
         overlay.style.display = 'none';
         
         // ★画像演出が完全に終わったこの瞬間に、bodyの制限クラスを外します
         // これにより、タイトル（浮かび上がり）とフッター（フェードイン）のアニメーションが自動で開始されます
         document.body.classList.remove('opening-active');
         
         // 本編コンテンツ（本文のアニメーションなど）を開始
         revealMainContent();
       }, 1500);

     }, 4000);
   } else {
     // オープニング用要素が見つからない場合は、制限クラスを即座に外して表示します
     document.body.classList.remove('opening-active');
     revealMainContent();
   }
 });
 </script>
